<!DOCTYPE html>
<html lang="fa" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mirzadah</title>
<link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-192.png"><meta name="theme-color" content="#0c0e14"><meta name="apple-mobile-web-app-capable" content="yes">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark;--bg:#0c0e14;--card:#161a24;--card2:#1d2230;--tx:#f3efe6;--mu:#9a98a3;--gd:#d4af37;--gd2:#f1d98a;--bd:#2b3042;--ok:#55c08b;--bad:#ef6b5e}
:root[data-theme="light"]{color-scheme:light;--bg:#f4f1ea;--card:#fff;--card2:#faf7ef;--tx:#1b1a17;--mu:#79756b;--gd:#a67c00;--gd2:#7a5a00;--bd:#e3dccb;--ok:#2e7d4f;--bad:#c0392b}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;background:radial-gradient(1200px 500px at 50% -10%,#1f2540 0,var(--bg) 60%) fixed;color:var(--tx);font-family:Tahoma,"Segoe UI",Arial,sans-serif;font-size:14px;padding-bottom:84px;min-height:100vh}
header{padding:16px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--bd);background:rgba(12,14,20,.6)}
.lg{font-family:Georgia,"Times New Roman",serif;font-size:24px;letter-spacing:4px;background:linear-gradient(90deg,var(--gd2),var(--gd));-webkit-background-clip:text;background-clip:text;color:transparent;font-weight:700}
header small{display:block;color:var(--mu);font-size:11px;letter-spacing:0}
main{padding:14px;max-width:1150px;margin:auto}html,body{height:auto;overflow-y:auto}.tbr{display:flex;gap:6px;position:sticky;top:-12px;background:var(--card);padding:6px 0;margin-bottom:6px;z-index:2}.tbr .btn{padding:7px 12px}@media print{body>*:not(#m){display:none!important}#m{position:static!important;background:none!important;display:block!important}#m>div{max-height:none!important;overflow:visible!important;border:0!important;padding:0!important}.np{display:none!important}body{background:#fff!important}}.gl{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:10px}.gl .c{margin-bottom:0}.th{width:100%;height:120px;object-fit:cover;border-radius:10px;margin-bottom:8px}.ph{display:grid;grid-template-columns:repeat(auto-fill,minmax(90px,1fr));gap:8px;margin-bottom:6px}.ph img{width:100%;height:80px;object-fit:cover;border-radius:8px;border:1px solid var(--bd)}@media(min-width:900px){#m{align-items:center}#m>div{border-radius:20px;max-width:760px}}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:10px}
.c{background:linear-gradient(160deg,var(--card),var(--card2));border:1px solid var(--bd);border-radius:16px;padding:13px;margin-bottom:10px;box-shadow:0 6px 18px rgba(0,0,0,.25)}
.k{color:var(--mu);font-size:12px}.v{font-size:19px;font-weight:700;margin-top:3px}.gd{color:var(--gd)}
.ok{color:var(--ok)}.bad{color:var(--bad)}h3,h4{margin:6px 0 10px;color:var(--gd2)}
.bdg{display:inline-block;padding:2px 10px;border-radius:20px;font-size:12px;border:1px solid var(--gd);color:var(--gd)}
.bdg.new{color:#e8c25a;border-color:#e8c25a}.bdg.transit{color:#7db4ee;border-color:#7db4ee}.bdg.presale{color:#c79bdc;border-color:#c79bdc}.bdg.lot{color:var(--ok);border-color:var(--ok)}.bdg.repair{color:#f0a53d;border-color:#f0a53d}.bdg.sold{color:var(--mu);border-color:var(--mu)}
nav{position:fixed;bottom:0;left:0;right:0;background:rgba(18,21,30,.96);border-top:1px solid var(--bd);display:flex;padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;border:0;background:none;color:var(--mu);padding:9px 2px;font:inherit;font-size:11px}nav button.on{color:var(--gd);font-weight:700}nav i{display:block;font-style:normal;font-size:19px}
.btn{background:linear-gradient(90deg,var(--gd),var(--gd2));color:#1a1405;border:0;border-radius:11px;padding:10px 16px;font:inherit;font-weight:700;cursor:pointer}
.btn.s{background:var(--card2);color:var(--tx);border:1px solid var(--bd)}.btn.d{background:transparent;color:var(--bad);border:1px solid var(--bad)}.btn.w{width:100%;margin-bottom:10px}
.chips{display:flex;gap:6px;overflow-x:auto;margin-bottom:10px;padding-bottom:4px}
.chips button{white-space:nowrap;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:20px;padding:6px 13px;font:inherit;font-size:13px}.chips button.on{border-color:var(--gd);color:var(--gd)}
input,select{width:100%;padding:7px 9px;margin:2px 0 6px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);font:inherit}label{font-size:12px;color:var(--mu)}
.m2{display:flex;gap:6px}.m2 input{flex:2}.m2 select{flex:1}
#m,#lk{position:fixed;left:0;right:0;top:0;bottom:0;background:rgba(0,0,0,.65);display:none;align-items:flex-end;justify-content:center;z-index:9}
#lk{display:none;align-items:center;background:var(--bg);z-index:20;flex-direction:column;gap:10px}
#m>div{background:var(--card);width:100%;max-width:580px;max-height:96%;overflow:auto;border-radius:20px 20px 0 0;padding:12px;border-top:2px solid var(--gd)}
.r{display:flex;justify-content:space-between;gap:8px;align-items:center;margin:3px 0}.tb{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}td,th{padding:7px 5px;border-bottom:1px solid var(--bd);text-align:right;white-space:nowrap}
</style></head><body>
<header><div class="lg">MIRZADAH<small>مدیریت واردات و فروش موتر</small></div><div style="text-align:left"><span id="sy" class="k"></span><br><button class="chips" style="border:0;background:none;color:var(--gd);font:inherit;font-size:12px;padding:0" onclick="th()">☾ / ☀</button></div></header>
<main id="app"></main><nav id="nv"></nav>
<div id="m" onclick="if(event.target===this)cm()"><div id="mb"></div></div>
<div id="lk"><div class="lg">MIRZADAH</div><input id="pi" type="password" inputmode="numeric" placeholder="رمز ورود" style="max-width:200px;text-align:center"><button class="btn" onclick="unlock()">ورود</button></div>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="fb-adapter.js"></script>
<script>
const $=s=>document.querySelector(s),N=x=>+x||0;
const esc=s=>jx(String(s??'')).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ST={new:'خرید جدید',transit:'در راه',presale:'پیش‌فروش',lot:'در بانگاه',repair:'در ورکشاپ',sold:'فروخته شد'};
const WS=['تعمیر','قطعات','مزدوری استاد','رنگ و بادی','برق','تایر','معاش/کرایه','دیگر'],RD=['جریمه','گمرک','ترانسپورت','سوخت','کرایه راننده','اسناد','دیگر (راه)'],CAT=[...WS,...RD];
const fm=n=>(N(n)<0?'-':'')+'$'+Math.abs(Math.round(N(n))).toLocaleString('en-US');
const today=()=>new Date().toISOString().slice(0,10),uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,5);
const days=d=>d?Math.floor((Date.now()-new Date(d))/864e5):0;
const LS={get(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let T=LS.get('mzT',[]),E=LS.get('mzE',[]),CFG=LS.get('mzC',{rates:{AFN:70,EUR:0.92},partners:[]}),P=LS.get('mzP',[]),tab='dash',flt='all',xf='all',PF=[],DB=null,online=false;
const TABS=[['dash','📊','داشبورد'],['trucks','🚛','موترها'],['exp','🧾','مصارف'],['fin','💰','مالی'],['more','⚙️','بیشتر']];
const pays=t=>(t.pays||[]).reduce((a,p)=>a+N(p.a),0)+N(t.paid);
const cost=t=>N(t.buy)+N(t.ship)+E.filter(e=>e.tid===t.id).reduce((a,e)=>a+N(e.amt),0);
const sp=t=>N(t.sprice),rem=t=>sp(t)-pays(t);
function save(){LS.set('mzT',T);LS.set('mzE',E);LS.set('mzC',CFG);LS.set('mzP',P)}
function col(c){return c==='t'?'trucks':c==='e'?'expenses':'cfg'}
function put(c,o){const L=c==='t'?T:E,i=L.findIndex(x=>x.id===o.id);if(i<0)L.push(o);else L[i]=o;P=P.filter(p=>!(p.c===c&&p.id===o.id));P.push({c,id:o.id,op:'set'});save();render();flush()}
function del(c,id){if(c==='t')T=T.filter(x=>x.id!==id);else E=E.filter(x=>x.id!==id);P=P.filter(p=>!(p.c===c&&p.id===id));P.push({c,id,op:'del'});save();render();flush()}
function putCfg(){P=P.filter(p=>p.c!=='c');P.push({c:'c',id:'main',op:'set'});save();render();flush()}
async function flush(){if(!DB||!P.length)return;for(const p of [...P]){try{const r=DB.collection(col(p.c)).doc(p.id);
  if(p.op==='del')await r.delete();else{const o=p.c==='c'?CFG:(p.c==='t'?T:E).find(x=>x.id===p.id);if(o)await r.set(o)}
  P=P.filter(q=>!(q.c===p.c&&q.id===p.id&&q.op===p.op));save()}catch(e){break}}sync()}
function sync(){$('#sy').textContent=!DB?'آفلاین':P.length?'◌ '+P.length+' در انتظار ارسال':'● همگام'}
function cm(){$('#m').style.display='none';CUR=''}function om(h,b){$('#mb').innerHTML=(b===false?'':`<div class='tbr np'><button class='btn s' onclick='${CUR?'openTruck(&quot;'+CUR+'&quot;)':'cm()'}'>← بازگشت</button></div>`)+h;$('#m').style.display='flex';$('#mb').parentNode.scrollTop=0}
function f(id,l,t='text',v=''){return `<label>${l}</label><input id="${id}" type="${t}" value="${esc(v)}" ${t==='number'?'inputmode="decimal"':''}>`}
function sel(id,l,o,v){return `<label>${l}</label><select id="${id}">${o.map(([k,n])=>`<option value="${esc(k)}" ${k===v?'selected':''}>${esc(n)}</option>`).join('')}</select>`}
function mf(id,l,v=''){return `<label>${l}</label><div class="m2"><input id="${id}" type="number" inputmode="decimal" value="${v}"><select id="${id}c"><option>USD</option><option>EUR</option><option>AFN</option></select></div>`}
const g=id=>{const e=$('#'+id);return e.dataset.jd?j2g(e.value):e.value};
const usd=id=>{const c=g(id+'c'),r=c==='USD'?1:N(CFG.rates[c])||({EUR:.92,AFN:70})[c];return Math.round(N(g(id))/r*100)/100};
function truckForm(t={}){return `${f('n','نام / مدل (مثلاً Volvo FH16)','text',t.name)}${f('vin','شماره شاسی (VIN)','text',t.vin)}${f('yr','سال ساخت','number',t.yr)}${f('sup','فروشنده / کشور','text',t.sup)}${sel('pk','نوع خرید',[['single','تکی'],['full','همراه پاکت کامل']],t.pk||'single')}${f('mk','برند / مدل دقیق (Volvo, MAN, Mercedes...)','text',t.mk)}${f('cl','رنگ','text',t.cl)}${f('km','کیلومتر','number',t.km)}${f('en2','موتور / اسب بخار','text',t.en2)}${f('tr','گیربکس','text',t.tr)}${f('ax','نوع محور (4x2, 6x4...)','text',t.ax)}${f('inv','نمبر فاکتور / کانتینر','text',t.inv)}${f('pt','بندر / راه ورود','text',t.pt)}${mf('buy','قیمت خرید',t.buy||'')}${mf('ship','کرایه و گمرک',t.ship||'')}${sel('st','وضعیت',Object.entries(ST),t.status||'new')}${f('dt','تاریخ خرید','date',t.date||today())}${f('dep','تاریخ تخمینی حرکت (بعد از آن خودکار «در راه» می‌شود)','date',t.dep||'')}${f('eta','تاریخ تخمینی رسیدن (بعد از آن خودکار به ورکشاپ می‌رود)','date',t.eta||'')}`}
function addTruck(){om(`<h3>خرید موتر جدید</h3>${truckForm()}${pf()}<div class="r"><button class="btn" onclick="saveTruck()">ذخیره</button><button class="btn s" onclick="cm()">لغو</button></div>`)}
async function saveTruck(id){if(!g('n').trim())return;const o=T.find(x=>x.id===id)||{id:uid(),pays:[],sprice:0,cust:'',phone:''};const x={...o,name:g('n').trim(),buy:usd('buy'),ship:usd('ship'),status:g('st'),date:g('dt'),eta:g('eta'),dep:g('dep')};['vin','yr','sup','mk','cl','km','en2','tr','ax','inv','pt'].forEach(k=>x[k]=g(k));if(!id&&PF.length){$('#mb').innerHTML='<h3>در حال آپلود عکس و اسناد…</h3>';x.files=[];for(const p of PF){const r=await upf(p.f);if(r)x.files.push({...r,k:p.k,p:p.f.type==='application/pdf'})}PF=[]}put('t',x);cm()}
function openTruck(id){const t=T.find(x=>x.id===id);if(!t)return;const ex=E.filter(e=>e.tid===id);
  om(`${(CUR=id,'')}<div class="tbr np"><button class="btn s" onclick="cm()">← بازگشت</button><button class="btn s" onclick="editTruck('${id}')">✎ ویرایش</button><button class="btn d" onclick="askDel('${id}')">🗑 حذف موتر</button></div><div class="r"><h3>${esc(t.name)} ${esc(t.yr)}</h3><span class="bdg ${t.status}">${ST[t.status]}</span></div><div class="c k" style="line-height:1.9">VIN: ${esc(t.vin)||'—'} · ${esc(t.sup)} · ${esc(t.date)}<br>${[t.mk,t.cl,t.km&&t.km+' km',t.en2,t.tr,t.ax,t.inv&&'فاکتور '+t.inv,t.pt].filter(Boolean).map(esc).join(' · ')}</div>
  <div class="c" style="margin-top:8px"><div class="r"><span>خرید</span><b>${fm(t.buy)}</b></div><div class="r"><span>کرایه/گمرک</span><b>${fm(t.ship)}</b></div><div class="r"><span>🛣 مصارف راه</span><b>${fm(sumE(ex,'road'))}</b></div><div class="r"><span>🔧 مصارف ورکشاپ</span><b>${fm(sumE(ex,'ws'))}</b></div><div class="r"><span>قیمت تمام‌شده</span><b class="gd">${fm(cost(t))}</b></div></div>
  <div class="r"><button class="btn s" onclick="editTruck('${id}')">✎ ویرایش</button><button class="btn s" onclick="addExp('${id}')">+ مصرف</button>${NX[t.status]?`<button class="btn" onclick="nxt('${id}')">${t.status==='new'?'🚚 حرکت کرد':t.status==='transit'?'📦 رسید':'✅ تعمیر تمام شد'}</button>`:''}</div>${gal(t,'photo','📷 عکس موتر')}${gal(t,'doc','📄 اسناد موتر (گمرک، قباله، ...)')}
  <h4 style="margin-top:14px">فروش / پیش‌فروش</h4>${sel('st2','وضعیت',Object.entries(ST),t.status)}<div class="c"><b class="gd">مشخصات مشتری</b>${f('cu','نام مشتری','text',t.cust)}${f('fa','نام پدر','text',t.father)}${f('ph','شماره تلفن','tel',t.phone)}${f('ni','نمبر تذکره / پاسپورت','text',t.nid)}${f('pv','ولایت / شهر','text',t.prov)}${f('ad','آدرس دقیق','text',t.addr)}${f('ph2','شماره تلفن دوم','tel',t.phone2)}${f('gr','نام ضامن','text',t.guar)}${f('gp','تلفن ضامن','tel',t.guarPh)}${f('cn','یادداشت','text',t.cnote)}</div>${mf('sp','قیمت فروش (پیش‌پرداخت را پایین ثبت کنید)',t.sprice||'')}${f('du','سررسید پرداخت باقی‌مانده','date',t.due||'')}<button class="btn w" onclick="upSale('${id}')">ذخیره فروش</button>${sp(t)?`<button class="btn s w" onclick="CM='pre';contract('${id}')">📄 قرارداد پیش‌فروش (چاپ)</button><button class="btn s w" onclick="CM='sold';contract('${id}')">📄 فاکتور فروش (چاپ)</button><button style="display:none" onclick="contract('${id}')">📄 ${t.status==='sold'?'فاکتور فروش':'قرارداد پیش‌فروش'} (چاپ)</button>`:''}
  ${sp(t)?`<div class="c"><div class="r"><span>دریافتی</span><b class="ok">${fm(pays(t))}</b></div><div class="r"><span>باقی‌مانده</span><b class="bad">${fm(rem(t))}</b></div>${t.status==='sold'?`<div class="r"><span>سود</span><b class="${sp(t)-cost(t)>=0?'ok':'bad'}">${fm(sp(t)-cost(t))}</b></div>`:''}
  ${(t.pays||[]).map(p=>`<div class="r k"><span>${esc(p.d)} · ${fm(p.a)}</span><button class="btn d" style="padding:2px 9px" onclick="delPay('${id}','${p.id}')">✕</button></div>`).join('')}${mf('pm','دریافت جدید')}<button class="btn s" onclick="pay('${id}')">ثبت دریافتی</button> ${t.status!=='sold'?`<button class="btn" onclick="deliver('${id}')">🤝 تسلیم و تسویه</button>`:''}</div>`:''}
  ${expList(ex)}
  `,false)}
function editTruck(id){const t=T.find(x=>x.id===id);om(`<h3>ویرایش موتر</h3>${truckForm(t)}<p class="k">مبالغ به دلار نمایش داده می‌شوند؛ در صورت تغییر، دوباره وارد کنید.</p><div class="r"><button class="btn" onclick="saveTruck('${id}')">ذخیره</button><button class="btn s" onclick="openTruck('${id}')">لغو</button></div>`)}
function upSale(id){const t=T.find(x=>x.id===id),s=g('st2');put('t',{...t,status:s,cust:g('cu'),father:g('fa'),phone:g('ph'),nid:g('ni'),addr:g('ad'),prov:g('pv'),phone2:g('ph2'),guar:g('gr'),guarPh:g('gp'),cnote:g('cn'),sprice:usd('sp'),due:g('du'),sdate:s==='sold'?(t.sdate||today()):t.sdate||''});openTruck(id)}
const NX={new:'transit',transit:'repair',repair:'lot'};
const ety=e=>RD.includes(e.cat)?'road':'ws',owed=e=>e.paid==null?0:Math.max(0,N(e.amt)-N(e.paid)),sumE=(L,k)=>L.filter(e=>ety(e)===k).reduce((a,e)=>a+N(e.amt),0);
function pf(){return `<h4>📷 عکس موتر</h4><input type="file" accept="image/*" multiple onchange="pq('photo',this.files)"><h4>📄 اسناد (گمرک، قباله، فاکتور...)</h4><input type="file" accept="image/*,application/pdf" multiple onchange="pq('doc',this.files)"><div id="pl" class="k"></div>`}
function pq(k,fl){PF=PF.filter(p=>p.k!==k).concat([...fl].map(f=>({k,f})));$('#pl').textContent=PF.length+' فایل آماده آپلود'}
async function upf(file){try{const as=await window.claude?.use('assets');if(!as)return null;const r=await as.upload(await shrink(file));return {id:r.id,u:r.url}}catch(e){return null}}
function expRow(e){const o=owed(e);return `<div class="r k" onclick="addExp('${e.tid}','${e.id}')"><span>${esc(e.cat)} ${esc(e.note)} ${e.qty?'· '+esc(e.qty):''} ${e.vend?'· '+esc(e.vend):''}${o>0?` <span class="bad">قرض ${fm(o)}</span>`:''}</span><b>${fm(e.amt)}</b></div>`}
function expList(ex){return ['road','ws'].map(k=>{const L=ex.filter(e=>ety(e)===k);return L.length?`<h4>${k==='road'?'🛣 مصارف راه':'🔧 مصارف ورکشاپ'} (${fm(sumE(L,k))})</h4>${L.map(expRow).join('')}`:''}).join('')}
function debtors(){const m={};E.filter(e=>owed(e)>0).forEach(e=>{const k=e.vend||'نامشخص';m[k]=(m[k]||0)+owed(e)});const L=Object.entries(m);return L.length?`<h4>قرض‌دار به چه کسانی</h4><div class="c">${L.map(([k,v])=>`<div class="r"><span>${esc(k)}</span><b class="bad">${fm(v)}</b></div>`).join('')}</div>`:''}
function nxt(id){const t=T.find(x=>x.id===id);put('t',{...t,status:NX[t.status],mv:today()});openTruck(id)}
function auto(){T.forEach(t=>{let s=t.status;if(s==='new'&&t.dep&&t.dep<=today())s='transit';if(s==='transit'&&t.eta&&t.eta<=today())s='repair';if(s!==t.status)put('t',{...t,status:s,mv:today()})})}
function deliver(id){const t=T.find(x=>x.id===id),a=rem(t);if(!sp(t))return alert('اول قیمت فروش را ثبت کنید');if(!confirm('باقی‌مانده '+fm(a)+' دریافت و موتر تسلیم مشتری شود؟'))return;put('t',{...t,pays:a>0?[...(t.pays||[]),{id:uid(),a,d:today()}]:(t.pays||[]),status:'sold',sdate:today(),due:''});openTruck(id)}

function jx(s){return /^\d{4}-\d{2}-\d{2}$/.test(s)?g2j(s):s}
function g2jA(gy,gm,gd){const gdm=[0,31,59,90,120,151,181,212,243,273,304,334];let jy;if(gy>1600){jy=979;gy-=1600}else{jy=0;gy-=621}const gy2=gm>2?gy+1:gy;let days=365*gy+Math.floor((gy2+3)/4)-Math.floor((gy2+99)/100)+Math.floor((gy2+399)/400)-80+gd+gdm[gm-1];jy+=33*Math.floor(days/12053);days%=12053;jy+=4*Math.floor(days/1461);days%=1461;if(days>365){jy+=Math.floor((days-1)/365);days=(days-1)%365}const jm=days<186?1+Math.floor(days/31):7+Math.floor((days-186)/30),jd=1+(days<186?days%31:(days-186)%30);return [jy,jm,jd]}
function j2gA(jy,jm,jd){let gy;if(jy>979){gy=1600;jy-=979}else gy=621;let days=365*jy+Math.floor(jy/33)*8+Math.floor(((jy%33)+3)/4)+78+jd+(jm<7?(jm-1)*31:(jm-7)*30+186);gy+=400*Math.floor(days/146097);days%=146097;if(days>36524){days--;gy+=100*Math.floor(days/36524);days%=36524;if(days>=365)days++}gy+=4*Math.floor(days/1461);days%=1461;if(days>365){gy+=Math.floor((days-1)/365);days=(days-1)%365}let gd=days+1;const sal=[0,31,((gy%4==0&&gy%100!=0)||gy%400==0)?29:28,31,30,31,30,31,31,30,31,30,31];let gm;for(gm=0;gm<13;gm++){if(gd<=sal[gm])break;gd-=sal[gm]}return [gy,gm,gd]}
const p2=n=>String(n).padStart(2,'0');
function g2j(s){const a=s.split('-').map(Number),j=g2jA(a[0],a[1],a[2]);return j[0]+'/'+p2(j[1])+'/'+p2(j[2])}
function dg(s){return String(s).replace(/[۰-۹]/g,d=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(d)).replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d))}
function j2g(t){const d=dg(t).replace(/\D/g,'');if(d.length!==8)return '';let y=+d.slice(0,4),m=+d.slice(4,6),dd=+d.slice(6,8);if(m<1||m>12||dd<1||dd>31)return '';if(y>1700)return y+'-'+p2(m)+'-'+p2(dd);const x=j2gA(y,m,dd);return x[0]+'-'+p2(x[1])+'-'+p2(x[2])}
function fmtJ(s){const d=dg(s).replace(/\D/g,'').slice(0,8);return d.length>6?d.slice(0,4)+'/'+d.slice(4,6)+'/'+d.slice(6):d.length>4?d.slice(0,4)+'/'+d.slice(4):d}

function addWd(ty,wid){const x=WD.find(y=>y.id===wid)||{};om(`<h3>${wid?'ویرایش':'ثبت'} برداشت</h3>${f('wn','نام برداشت‌کننده (کی برداشت کرد)','text',x.nm)}${sel('wt','نوع برداشت',[['cap','↩ از سرمایه'],['exp','🧾 بابت مصرف']],x.ty||ty||'cap')}${mf('wa','مقدار پول',x.amt||'')}${f('wdd','تاریخ','date',x.date||today())}${f('wbp','بابت چی','text',x.fr)}${f('wsr','از کجا برداشت (صندوق / بانک / صرافی ...)','text',x.src)}${sel('wtk','برای کدام موتر (اختیاری)',[['','—'],...T.map(t=>[t.id,t.name+' '+(t.yr||'')+' '+(t.vin||'')])],x.tid||'')}${f('won','یادداشت','text',x.note)}<div class='r'><button class='btn' onclick='saveWd(&quot;${wid||''}&quot;)'>ذخیره</button>${wid?`<button class='btn d' onclick='delWd(&quot;${wid}&quot;)'>حذف</button>`:''}</div>`)}
